[tools]
java = "temurin-25.0.2+10.0.LTS"
node = "24.14.0"
maven = "3.9.14"

[plugins]
maven = 'https://github.com/mise-plugins/mise-maven'

[hooks]
postinstall = "pnpm install"

[tasks.reset]
run = [
    "nx run-many -t clean",
    "nx reset"
]

[env]
_.path = ['{{config_root}}/node_modules/.bin']
NX_DEFAULT_OUTPUT_STYLE = 'stream-without-prefixes'
NX_BATCH_MODE = 'true'

[settings]
experimental = true

[settings.node]
corepack = true
